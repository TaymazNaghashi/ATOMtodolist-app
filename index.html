<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To-do</title>
<meta name="description" content="Your to-do list, synced between your phone and ATOM.">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="To-do">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<link rel="stylesheet" href="ios.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="page">
  <header class="nav" id="nav">
    <span class="left"></span>
    <span class="small-title" id="small-title">Today</span>
    <span class="right"><button class="nav-btn" id="btn-settings" aria-label="Settings"></button></span>
  </header>
  <section class="large" id="large">
    <h1 id="title">Today</h1>
    <div class="sub"><span id="count-line"></span> <span class="status" id="status" role="status" aria-live="polite"></span></div>
  </section>
  <main class="content" id="list"></main>
</div>

<nav class="tabbar" id="tabs" aria-label="Lists">
  <button data-view="today"><span data-icon="sun"></span>Today</button>
  <button data-view="upcoming"><span data-icon="calendar"></span>Upcoming</button>
  <button data-view="all"><span data-icon="tray"></span>All</button>
  <button data-view="done"><span data-icon="checkCircle"></span>Completed</button>
</nav>

<div id="scrim"></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-hidden="true"></div>

<script src="docsync.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>
</body>
</html>
